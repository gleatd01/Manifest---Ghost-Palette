name: Deploy Release to Prod Branch

on:
  release:
    types: [published] # Triggers automatically when your release.yml finishes and publishes

jobs:
  sync-to-prod:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the specific code snapshot that was just released (has your hardcoded version)
      - name: Checkout Release Code
        uses: actions/checkout@v4

      # 2. Immediately force-push this exact state to the 'prod' branch
      - name: Force Push to Prod Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force push the current commit to the remote 'prod' branch
          # (Using --force overwrites 'prod' with this exact release state)
          git push origin HEAD:prod --force
